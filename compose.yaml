services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer_app
      POSTGRES_PASSWORD: customer_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_app -d customer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: