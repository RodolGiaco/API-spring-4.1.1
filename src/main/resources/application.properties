spring.mvc.problemdetails.enabled=true
spring.profiles.default=local
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/customer_db}
spring.datasource.username=${DB_USERNAME:customer_app}
spring.datasource.password=${DB_PASSWORD:customer_app}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

spring.lifecycle.timeout-per-shutdown-phase=20s

info.app.name=customer-api
info.app.description=Customer management REST API
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false